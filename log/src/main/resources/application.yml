spring:
  application:
    name: fullmooney-tistory-com
  profiles:
    active: local
  devtools:
    livereload:
      port: 18090
      enabled: true

minio:
  bucket: multipart
  url: http://minio:9000
  access:
    key: B707VnyChdLoF7NGZI2K
    secret: 7HryR2WUI9IM2B3XfW1u9qK2xsxavOuB8UoTHoLM

server:
  servlet:
    context-path: /app
  port: 8081

logging:
  config: classpath:logback-spring.xml

springdoc:
  disable-i18n: true
  swagger-ui:
    doc-expansion: none
    path: /api/swagger-ui

#log path
logs:
  absolute:
    path: /tmp/logs
  level:
    root: INFO
    com: DEBUG
  name: fullmooney-tistory-com

logbook:
  exclude:
  - '**/health'
  - '**/v3/api-docs/**'
  - '**/v2/api-docs/**'
  - '**/v1/api-docs/**'
  - '**/swagger-resources/**'
  - '**/configuration/security'
  - '**/swagger'
  - '**/csrf'
  - '**/error'
  - '**/configuration'
  - '**/swagger-ui.html'
  - '**/favicon.*'
  - '**/h2-console/**'
  - '**/webjars/**'
  - '**/swagger-ui/**'
  - '**/swagger-ui/*'
  - '**/swagger-resources/**'
  - '**/etrack/exportArchive'
  - '**/*-stream'
  - '**/admin/**'
